
apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blue-green
      version: green
  template:
    metadata:
      labels:
        app: blue-green
        version: green
    spec:
      containers:
        - name: web-app
          image: assignment-8-green
          imagePullPolicy: Never
          ports:
            - containerPort: 80
