
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blue-green
      version: blue
  template:
    metadata:
      labels:
        app: blue-green
        version: blue
    spec:
      containers:
        - name: web-app
          image: assignment-8-blue
          imagePullPolicy: Never
          ports:
            - containerPort: 80
